<!doctype html>
<html lang="he" dir="rtl">

    <meta name="description" content="SabanOS Delivery Notes OCR, Cross-Audit & Procurement Engine for H. Saban Building Materials" />
    
    <!-- PWA & Mobile Web App Capabilities -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#128C7E" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Heebo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <body class="bg-slate-50 text-slate-900 font-['Heebo',sans-serif] antialiased selection:bg-emerald-500 selection:text-white overscroll-none touch-manipulation">

    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
